# On a version tag, publishes the jar as a release of this repo.

name: release
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: check the tag matches the version
        run: |
          version=$(sed -n 's/^version=//p' gradle.properties)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match version=$version in gradle.properties"
            exit 1
          fi
      - name: build
        run: ./gradlew build
      - name: publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # pre-release tags (vX.X.X-beta.1) are skipped by "latest release", so UpdateCheck ignores them.
        run: |
          jar=$(ls build/libs/*.jar | grep -v -- '-sources\.jar$')
          prerelease=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            prerelease=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" "$jar" "${prerelease[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Tascade ${GITHUB_REF_NAME#v}" \
            --notes "Tascade ${GITHUB_REF_NAME#v} for Minecraft 1.16.1. Requires Fabric Loader, SpeedrunAPI and SpeedRunIGT."
