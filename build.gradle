plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}

repositories {
	maven {
		name = "Modrinth"
		url = "https://api.modrinth.com/maven"
		content {
			includeGroup "maven.modrinth"
		}
	}
	ivy {
		name = "MCSR legal mods"
		url = "https://github.com/Minecraft-Java-Edition-Speedrunning/legal-mods/raw/2ba63fc475270404e4a1c1f910f22bdc9bc14186/legal-mods"
		patternLayout {
			artifact "[module]/1.16-1.16.1/[module]-[revision].[ext]"
		}
		metadataSources {
			artifact()
		}
		content {
			includeGroup "mcsr.legal-mods"
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation("maven.modrinth:speedrunigt:14.1+1.16.1")
	modImplementation("mcsr.legal-mods:speedrunapi:2.2+1.16-1.16.1")
	include(modImplementation("org.json:json:20231013"))
	include(modImplementation("io.socket:socket.io-client:2.1.0"))
	include(modImplementation("com.squareup.okhttp3:okhttp:4.12.0"))
	include(modImplementation("com.squareup.okio:okio-jvm:3.9.0"))
	include(modImplementation("io.socket:engine.io-client:2.1.0"))
	include(modImplementation("org.jetbrains.kotlin:kotlin-stdlib:1.9.22"))
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 8
	// sources contain non-ASCII text
	it.options.encoding = "UTF-8"
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_1_8
	targetCompatibility = JavaVersion.VERSION_1_8
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	repositories {
	}
}
